{% extends 'base.html' %}

{% block content %}
{% if post.image %}
  <img src="{{ post.image.url }}"
       style="width:200px; border-radius:10px;">
{% endif %}

<section class="posts">
  {% for post in object_list %}
    <article class="post-card">
      <h2>
        <a href="{% url 'post_detail' post.pk %}">
          {{ post.title }}
        </a>
      </h2>
      <p>{{ post.body|slice:":100" }}...</p>
    </article>
  {% endfor %}
</section>
{% endblock %}
