{% extends 'base.html' %}

{% block content %}
<section class="posts">
  {% for post in object_list %}
    <article class="post-card">
      {% if post.image %}
        <a href="{% url 'post_detail' post.pk %}">
          <img src="{{ post.image.url }}" alt="" style="width:200px; border-radius:10px; display:block; margin-bottom:0.5em;">
        </a>
      {% endif %}
      <h2>
        <a href="{% url 'post_detail' post.pk %}">
          {{ post.title }}
        </a>
      </h2>
      <p>{{ post.body|slice:":100" }}{% if post.body|length > 100 %}...{% endif %}</p>
    </article>
  {% endfor %}
</section>
{% endblock %}
