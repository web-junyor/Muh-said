{% extends 'base.html' %}

{% block content %}
<section class="form-page">
  <h1 class="form-title">✏️ Postni tahrirlash</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
      <button type="submit" class="btn primary">✅ Saqlash</button>
      <a href="{% url 'post_detail' object.pk %}" class="btn ghost">⬅ Orqaga</a>
    </div>
  </form>
</section>
{% endblock %}
